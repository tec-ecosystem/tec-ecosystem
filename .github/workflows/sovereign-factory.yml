name: TEC Sovereign AI Factory & Pi Network 2026

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read   # Changed from write to read (principle of least privilege)
  checks: write    # Required for test results
  actions: read    # Required for artifacts

jobs:
  sovereign-pipeline:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production

      # 🔑 API Keys
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # 🏛️ Paid Core Models
      GPT_MODEL: ${{ secrets.GPT_MODEL }}
      CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      CODEX_MODEL: ${{ secrets.CODEX_MODEL }}

      # 🛡️ Free/Reserve Models
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      LLAMA_MODEL: ${{ secrets.LLAMA_MODEL }}
      QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
      HERMES_MODEL: ${{ secrets.HERMES_MODEL }}
      GPT_OSS_FREE: ${{ secrets.GPT_OSS_FREE }}
      GEMINI_FLASH_FREE: ${{ secrets.GEMINI_FLASH_FREE }}
      O4_ENGINEER_MODEL: ${{ secrets.O4_ENGINEER_MODEL }}
      DEVSTRAL_MODEL: ${{ secrets.DEVSTRAL_MODEL }}

      # 🔗 Pi Network App & Sandbox
      NEXT_PUBLIC_PI_APP_ID: ${{ secrets.NEXT_PUBLIC_PI_APP_ID }}
      NEXT_PUBLIC_PI_SANDBOX: ${{ secrets.NEXT_PUBLIC_PI_SANDBOX }}

    steps:
      # 1️⃣ Checkout repository
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      # 2️⃣ Setup Node.js
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      # 3️⃣ Install dependencies
      # Note: We need devDependencies (TypeScript, @types/*) for the build step
      - name: 📚 Install Dependencies
        env:
          NPM_CONFIG_PRODUCTION: "false"
        run: npm ci

      # 4️⃣ Generate Prisma Client (DB & Sandbox)
      - name: 🔧 Generate Prisma Client
        run: npx prisma generate

      # 5️⃣ Build Project
      - name: 🏗️ Build Project
        run: npm run build --if-present

      # 6️⃣ Run AI Sovereign Factory for all 24 Domains
      - name: 🤖 Run AI Self-Healing System (Sovereign Factory)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          node index.js --all-domains

      # 7️⃣ AI Failure Summary
      - name: ⚠️ AI Failure Summary
        if: failure()
        run: |
          echo "### ❌ فشل النظام الذكي في معالجة أحد الدومينات أو إنشاء الملفات" >> $GITHUB_STEP_SUMMARY
          echo "تم إجراء محاولات تلقائية ولم تنجح بالكامل." >> $GITHUB_STEP_SUMMARY
          echo "يرجى مراجعة الـ Logs يدوياً." >> $GITHUB_STEP_SUMMARY
          exit 1

      # 8️⃣ Upload Build + Ledger + Artifacts
      - name: 📦 Upload Build & Ledger Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sovereign-factory-output
          path: |
            .next/
            public/
            ledger_full_log.json
            build.log
          retention-days: 7

      # 9️⃣ Success Notification
      - name: ✅ Build & Factory Success
        if: success()
        run: echo "✅ Build + AI Factory for all domains completed successfully!"
