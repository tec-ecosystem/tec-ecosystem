name: TEC Sovereign AI Factory & Build 2026

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read   # Changed from write to read (principle of least privilege)
  checks: write    # Required for test results
  actions: read    # Required for artifacts

jobs:
  build-and-sovereign:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production

      # 🔗 App / Sandbox / Base URLs
      NEXT_PUBLIC_BASE_URL: https://tec-ecosystem.vercel.app
      DATABASE_URL: postgresql://dummy:user@dummy:5432/dummy?schema=public
      NEXT_PUBLIC_PI_APP_ID: dummy_app_id
      NEXT_PUBLIC_PI_SANDBOX: true
      NEXT_PUBLIC_API_URL: https://tec-ecosystem.vercel.app
      SKIP_ENV_VALIDATION: true

      # 🔐 AI Models & API Keys
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # 🏛️ Paid Core Models
      GPT_MODEL: ${{ secrets.GPT_MODEL }}
      CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      CODEX_MODEL: ${{ secrets.CODEX_MODEL }}

      # 🛡️ Free / Reserve Models
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      LLAMA_MODEL: ${{ secrets.LLAMA_MODEL }}
      QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
      HERMES_MODEL: ${{ secrets.HERMES_MODEL }}
      GPT_OSS_FREE: ${{ secrets.GPT_OSS_FREE }}
      GEMINI_FLASH_FREE: ${{ secrets.GEMINI_FLASH_FREE }}
      O4_ENGINEER_MODEL: ${{ secrets.O4_ENGINEER_MODEL }}
      DEVSTRAL_MODEL: ${{ secrets.DEVSTRAL_MODEL }}

    steps:
      # 1️⃣ Checkout repository
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      # 2️⃣ Setup Node.js
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      # 3️⃣ Install dependencies
      # ملاحظة مهندس AI: لو الـ npm ci بيفشل، شغل npm install محلياً وارفع الـ lock file الجديد
      - name: 📚 Install dependencies
        env:
          NPM_CONFIG_PRODUCTION: "false"
        run: npm ci

      # 🛡️ 4️⃣ اختبارات السيادة والحوكمة (AI Engineering Check)
      # تضمن هذه الخطوة أن الـ AI يلتزم بالمسارات المسموحة والـ Ledger
      - name: 🏛️ Run Sovereign Governance Tests
        run: npm run test:governance
        # في حال لم تكن الاختبارات مضافة للـ scripts بعد، استخدم: npx jest tests/unit/governance.test.js

      # 5️⃣ Generate Prisma Client
      - name: 🔧 Generate Prisma Client
        run: npx prisma generate

      # 6️⃣ Build Next.js Application
      - name: 🏗️ Build Next.js Application
        run: npm run build

      # 7️⃣ Run AI Sovereign Factory (Self-Healing & Agents)
      # Note: continue-on-error is intentional to allow failure reporting
      # without blocking the pipeline. The next step will handle failure.
      - name: 🤖 Run AI Self-Healing System (Sovereign Factory)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        id: ai_process
        run: node index.js
        continue-on-error: true

      # 8️⃣ AI Failure Summary
      - name: ⚠️ AI Failure Summary
        if: steps.ai_process.outcome == 'failure'
        run: |
          echo "### ❌ فشل النظام الذكي في الوصول لكود مستقر" >> $GITHUB_STEP_SUMMARY  
          echo "تم إجراء محاولات تصحيح تلقائي ولم تنجح." >> $GITHUB_STEP_SUMMARY  
          echo "يرجى مراجعة الـ Logs يدوياً." >> $GITHUB_STEP_SUMMARY  
          exit 1

      # 9️⃣ Upload Build + Ledger + Artifacts
      - name: 📦 Upload Build & Ledger Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-and-sovereign-output
          path: |
            .next/  
            public/  
            agents/sovereign-agent/ledger.json
            build.log
          retention-days: 7

      # 🔟 Success Notification
      - name: ✅ Build & Factory Success
        if: success()
        run: echo "✅ Build + AI Factory completed successfully!"

  vercel-deploy:
    runs-on: ubuntu-latest
    needs: build-and-sovereign
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    permissions:
      contents: read
      deployments: write
      statuses: write
      pull-requests: write
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v42
        id: vercel-deploy
        env:
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          PI_API_SECRET: ${{ secrets.PI_API_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          PI_SANDBOX_MODE: ${{ secrets.PI_SANDBOX_MODE }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--prod' || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-comment: false
          working-directory: ./

      - name: 📊 Deployment Summary
        run: |
          echo "### 🚀 Vercel Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.vercel-deploy.outputs.preview-url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}" >> $GITHUB_STEP_SUMMARY
